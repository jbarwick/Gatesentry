# GateSentry — first-run / bridged sample
#
# Use this to try v2 on a workstation or a server that cannot take port 53.
# Production LAN DNS (port 53, real client IPs, mDNS): docker-compose.host.yml
#
# Prerequisite: the image is runtime-only. Build the binary on the host first:
#   cd ui && npm install && cd ..
#   ./build.sh
#   docker compose up -d --build
#
# Admin UI:  http://localhost:8080/     (user admin / admin — change it)
# DNS:       dig @127.0.0.1 -p 10053 example.com
# Proxy:     localhost:10413
# Data:      ./data  (settings, log.db, CA, devices.json)

services:
  gatesentry:
    build:
      context: .
      dockerfile: Dockerfile
    image: gatesentry:2.0.0-beta.11
    container_name: gatesentry
    restart: unless-stopped
    ports:
      - "10053:10053/udp"
      - "10053:10053/tcp"
      - "8080:8080"
      - "9877:9877"
      - "10413:10413"
      - "10414:10414"
      - "5353:5353/udp"
    volumes:
      - ./data:/usr/local/gatesentry/gatesentry
    environment:
      - TZ=${TZ:-UTC}
      - GS_ADMIN_PORT=8080
      - GS_ADMIN_PORT_SSL=9877
      # Code default is /gatesentry; / makes the UI http://host:8080/
      - GS_BASE_PATH=/
      - GATESENTRY_DNS_PORT=10053
      # Quote this value. Bare :: is invalid YAML (nested mapping).
      - "GATESENTRY_DNS_ADDR=0.0.0.0,::"
      - GS_MAX_SCAN_SIZE_MB=2
      # Leave GATESENTRY_DNS_RESOLVER unset so the UI/stored value is used
      # (default 8.8.8.8:53). A non-empty value overwrites dns_resolver on every start.
      # - GATESENTRY_DNS_RESOLVER=8.8.8.8:53
      # AAAA/HTTPS/ip6.arpa upstream. Set in the DNS UI, or uncomment:
      # - GATESENTRY_DNS_RESOLVER_IPV6=[2001:4860:4860::8888]:53
      # - GS_TRANSPARENT_PROXY=false
      # - GS_DEBUG_LOGGING=true
